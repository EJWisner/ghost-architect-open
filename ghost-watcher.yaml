ghost_watcher:
  version: "1.0"
  enabled: true
  trigger:
    branches:
      - feature/**
      - v7-unified
  scans:
    blast_radius: true
    conflict_detection: true
    ghost_brief: true
    conflict_verify: false
  portal:
    repo: https://github.com/EJWisner/ghost-reports-portal-test
    token_env: GHOST_PORTAL_TOKEN
  exclude:
    - "test/**"
    - "tests/**"
    - "test-*.js"
    - "prompts/**"
    - "prompts-extracted/**"
    - "scripts/**"
    - "audit-reports/**"
    - "*.png"
    - "*.jpg"
    - "*.pdf"
  notifications:
    pr_comment: true
    email:
      - ejwisner@gmail.com
  iterations:
    max: 50
  team:
    config: team.yaml
