# Ghost Watcher™ — GitHub Actions Workflow
# Auto-generated by Ghost Architect. Do not edit manually.
# To reconfigure, run: ghost → Ghost Watcher → Configure Watch
# To disable, run: ghost → Ghost Watcher → Disable Watch

name: Ghost Watcher™

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'v7-unified'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ghost-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Ghost Architect
        run: npm install -g ghost-architect-open@latest --force

      - name: Debug -- Test Batches API with Node.js fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --input-type=module --eval "
          const key = process.env.ANTHROPIC_API_KEY;
          console.log('API key present:', !!key, 'length:', key?.length);

          console.log('Testing /v1/messages endpoint...');
          try {
            const r1 = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' },
              body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] })
            });
            console.log('/v1/messages status:', r1.status);
          } catch (e) {
            console.log('/v1/messages ERROR:', e.message);
          }

          console.log('Testing /v1/messages/batches endpoint...');
          try {
            const r2 = await fetch('https://api.anthropic.com/v1/messages/batches', {
              method: 'POST',
              headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' },
              body: JSON.stringify({ requests: [{ custom_id: 'test-1', params: { model: 'claude-haiku-4-5-20251001', max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] } }] })
            });
            console.log('/v1/messages/batches status:', r2.status);
            const text = await r2.text();
            console.log('/v1/messages/batches response:', text.slice(0, 200));
          } catch (e) {
            console.log('/v1/messages/batches ERROR:', e.message);
          }
          " 2>&1

      - name: Run Ghost Watcher
        run: ghost --watcher-commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_LICENSE_KEY: ${{ secrets.GHOST_LICENSE_KEY }}
          GHOST_PORTAL_REPO: ${{ secrets.GHOST_PORTAL_REPO }}
          GHOST_PORTAL_TOKEN: ${{ secrets.GHOST_PORTAL_TOKEN }}
          GHOST_PR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ghost Pulse telemetry
        if: always()
        run: |
          if [ -f /tmp/ghost-watcher-telemetry.json ]; then
            PAYLOAD=$(cat /tmp/ghost-watcher-telemetry.json)
          else
            PAYLOAD='{"userId":"ci-ejwisner","version":"9.1.0","tier":"team","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'","findings":0,"severity":{"critical":0,"high":0,"medium":0,"low":0},"prompts":0,"scans":{"blast":true,"conflict":true,"brief":true},"commitHash":"${{ github.sha }}","repoHash":"ghost-architect"}'
          fi
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "X-Ghost-Client: ghost-architect-ci" \
            --max-time 10 \
            -d "$PAYLOAD" \
            https://signup.ghostarchitect.dev/watcher-ping || true
