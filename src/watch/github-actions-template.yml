# Ghost Watcher™ — GitHub Actions Workflow
# Auto-generated by Ghost Architect. Do not edit manually.
# To reconfigure, run: ghost → Ghost Watcher → Configure Watch
# To disable, run: ghost → Ghost Watcher → Disable Watch
#
# Required repo secrets:
#   ANTHROPIC_API_KEY  - your Anthropic API key
#   GHOST_LICENSE_KEY  - the signed token printed by "ghost --export-ci-token"
#                        (run it on the machine where you activated Ghost;
#                        do NOT paste your GA- license key here)
#   GHOST_PORTAL_REPO  - your ghost-reports repo URL
#   GHOST_PORTAL_TOKEN - GitHub PAT with repo write scope

name: Ghost Watcher™

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ghost-watcher:
    runs-on: ubuntu-latest
    # GitHub Actions maximum (6 hours). The Actions job should never be the
    # limiting factor — the batch poll timeout (batch.timeout_minutes) and the
    # store-and-resume logic handle actual time management. On batch timeout the
    # run is stored and the next push resumes it, so a long batch never loses work.
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Ghost Architect
        run: npm install -g ghost-architect-open@latest --force

      - name: Run Ghost Watcher
        run: ghost --watcher-commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_LICENSE_KEY: ${{ secrets.GHOST_LICENSE_KEY }}
          GHOST_PORTAL_REPO: ${{ secrets.GHOST_PORTAL_REPO }}
          GHOST_PORTAL_TOKEN: ${{ secrets.GHOST_PORTAL_TOKEN }}
          GHOST_PR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ghost Watcher cancel handler
        if: cancelled()
        run: ghost --watcher-cancelled
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHOST_LICENSE_KEY: ${{ secrets.GHOST_LICENSE_KEY }}
          GHOST_PORTAL_REPO: ${{ secrets.GHOST_PORTAL_REPO }}
          GHOST_PORTAL_TOKEN: ${{ secrets.GHOST_PORTAL_TOKEN }}
          GHOST_PR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
